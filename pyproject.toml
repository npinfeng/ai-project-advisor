[project]
name = "project-advisor"
version = "0.2.0"
description = "AI 技术选型与开源项目评估 Agent — 基于 LangGraph 的多智能体系统"
authors = [
    { name = "npinfeng" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.5.4",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-tavily",
    "openai>=1.99.2",
    "tavily-python>=0.5.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "chromadb>=0.4.0",
    "rank-bm25>=0.2.0",
    "sentence-transformers>=3.0.0",
    "langchain-text-splitters>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.9.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.scripts]
project-advisor-web = "project_advisor.app:main"
project-advisor-mcp = "project_advisor.mcp_server:main"
project-advisor-eval = "project_advisor.evaluation:main"

[project.optional-dependencies]
dev = ["pytest", "mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_advisor*"]

[tool.setuptools.package-data]
project_advisor = ["py.typed", "static/*.html", "static/*.css", "static/*.js"]
